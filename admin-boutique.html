<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration - Gabshop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
  <style>
    .collections-lignes-liste, .couleurs-produit-liste {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }
    .collection-ligne-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .couleur-produit-bloc {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .collection-ligne-item .custom-select {
      flex: 1;
    }
    .btn-icon {
      padding: 8px 12px;
      font-size: 1.1rem;
      line-height: 1;
      border-radius: 4px;
      flex: none !important;
      width: auto !important;
    }
    .article-fichiers-input {
      flex: 1 1 auto !important;
      width: 100% !important;
      min-width: 0 !important;
    }
  </style>
</head>

<body>

<header>
  <div id="site-header"></div>
</header>

<main>

  <p id="admin-chargement" class="account-intro">Vérification des droits...</p>

  <div id="admin-contenu" class="hidden">

    <p class="account-eyebrow">GABSHOP</p>
    <h1>Administration</h1>

    <!-- IMPORT DES ARTICLES EXISTANTS -->
    <section class="admin-section">
      <h2>Import initial</h2>
      <button type="button" id="bouton-import" class="btn btn-secondary">
        Importer les 5 articles existants
      </button>
      <p id="import-message" class="form-error" style="display:none;"></p>
    </section>

    <!-- ARTICLES -->
    <section class="admin-section">
      <h2>Articles</h2>

      <div id="admin-articles-liste"></div>

      <button type="button" id="bouton-nouvel-article" class="btn btn-primary">
        + Ajouter un article
      </button>

      <form id="article-form" class="account-form admin-form hidden">

        <input type="hidden" id="article-id-en-cours">

        <div>
          <label for="article-nom">Nom</label>
          <input type="text" id="article-nom" required>
        </div>

        <div>
          <label for="article-description">Description</label>
          <textarea id="article-description" rows="3"></textarea>
        </div>

        <div>
          <label for="article-prix-base">Prix de base par défaut (€)</label>
          <input type="number" id="article-prix-base" min="0" step="0.01" required>
        </div>

        <div>
          <label for="article-taxes">Taxes (€)</label>
          <input type="number" id="article-taxes" min="0" step="0.01" value="0.40" required>
        </div>

        <div>
          <label>Images principales obligatoires * (Max 1 Mo par fichier)</label>
          <div id="images-lignes-conteneur" style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;">
            <div class="ligne-input-fichier" style="display: flex; align-items: center; gap: 8px;">
              <input type="file" class="article-fichiers-input" accept="image/*" multiple style="flex: 1 1 auto; width: 100%; min-width: 0;" />
              <button type="button" class="btn btn-secondary btn-icon bouton-ajouter-champ-image" title="Ajouter un autre champ" style="flex: none;">+</button>
            </div>
          </div>
          <div id="apercu-images-existantes" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;"></div>
        </div>

        <!-- VARIANTES DE COULEURS -->
        <div>
          <label>Variantes de Couleurs (Optionnel - Nom, Prix et Image obligatoire si ajoutée)</label>
          <div id="couleurs-produit-conteneur" class="couleurs-produit-liste"></div>
          <button type="button" id="bouton-ajouter-variante-couleur" class="btn btn-secondary" style="margin-top: 8px;">+ Ajouter une couleur</button>
        </div>

        <div>
          <label>Onglets Collections (optionnel)</label>
          <div id="collections-lignes-conteneur" class="collections-lignes-liste"></div>
        </div>

        <p id="article-message" class="form-error" style="display:none;"></p>

        <div style="display:flex; gap:10px; margin-top: 16px;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Enregistrer</button>
          <button type="button" id="bouton-annuler-article" class="btn btn-secondary" style="flex:1;">Annuler</button>
        </div>

      </form>
    </section>

    <!-- ONGLETS COLLECTIONS -->
    <section class="admin-section">
      <h2>Onglets "Collections" du menu</h2>
      <div id="admin-collections-liste"></div>
      <form id="collection-form" class="account-form admin-form">
        <div>
          <label for="collection-label">Nom du nouvel onglet</label>
          <input type="text" id="collection-label" placeholder="Ex : Nouveautés 2026" required>
        </div>
        <p id="collection-message" class="form-error" style="display:none;"></p>
        <button type="submit" class="btn btn-primary">+ Ajouter l'onglet</button>
      </form>
    </section>

    <div style="margin-top: 24px;">
      <a href="admin.html" class="btn btn-secondary">← Retour à l'administration</a>
    </div>

  </div>

</main>

<script type="module" src="main.js"></script>
<script type="module">
  import { auth } from './firebase-config.js';
  import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';
  import {
    obtenirRoleUtilisateur,
    ecouterProduits,
    ajouterProduit,
    modifierProduit,
    supprimerProduit,
    obtenirCollections,
    ajouterCollection,
    modifierCollection,
    supprimerCollection,
    convertirFichierEnBase64,
    formaterPrixProduit,
    importerProduitAvecId
  } from './main.js';

  const blocChargement = document.getElementById('admin-chargement');
  const blocContenu = document.getElementById('admin-contenu');

  function echapperHTML(texte) {
    const element = document.createElement('div');
    element.textContent = texte || '';
    return element.innerHTML;
  }

  onAuthStateChanged(auth, async function(utilisateur) {
    if (!utilisateur) {
      window.location.href = 'connexion.html';
      return;
    }
    const role = await obtenirRoleUtilisateur(utilisateur);
    if (role !== 'admin') {
      window.location.href = 'boutique.html';
      return;
    }
    blocChargement.classList.add('hidden');
    blocContenu.classList.remove('hidden');
    demarrer();
  });

  let produitsActuels = [];
  let collectionsActuelles = [];
  let collectionsSelectionnees = [''];
  let imagesActuellesEnCours = [];
  let variantesCouleursActuelles = []; 

  const TAILLE_MAX_FICHIER = 1024 * 1024; // 1 Mo
  const TAILLE_MAX_TOTALE = 1024 * 1024;  // 1 Mo cumulé max pour Firestore

  function demarrer() {
    ecouterProduits(function(produits) {
      produitsActuels = produits;
      afficherArticles();
    });
    chargerCollections();
    initialiserGestionChampsImages();
  }

  function afficherArticles() {
    const conteneur = document.getElementById('admin-articles-liste');
    if (produitsActuels.length === 0) {
      conteneur.innerHTML = '<p class="account-intro">Aucun article pour le moment.</p>';
      return;
    }

    conteneur.innerHTML = produitsActuels.map(function(produit) {
      let imgSrc = (produit.images && produit.images[0]) || '';
      if (produit.variantesCouleurs && produit.variantesCouleurs.length > 0 && produit.variantesCouleurs[0].images && produit.variantesCouleurs[0].images[0]) {
        imgSrc = produit.variantesCouleurs[0].images[0];
      }

      return `
        <div class="admin-ligne">
          <img src="${echapperHTML(imgSrc)}" class="admin-ligne-image" alt="">
          <div class="admin-ligne-info">
            <strong>${echapperHTML(produit.nom)}</strong>
            <span>${formaterPrixProduit(produit)}</span>
          </div>
          <div class="admin-ligne-actions">
            <button type="button" class="btn btn-secondary" data-modifier="${echapperHTML(produit.id)}">Modifier</button>
            <button type="button" class="btn btn-secondary" data-supprimer="${echapperHTML(produit.id)}">Supprimer</button>
          </div>
        </div>
      `;
    }).join('');

    conteneur.querySelectorAll('[data-modifier]').forEach(function(bouton) {
      bouton.addEventListener('click', function() {
        ouvrirFormulaireArticle(bouton.dataset.modifier);
      });
    });

    conteneur.querySelectorAll('[data-supprimer]').forEach(function(bouton) {
      bouton.addEventListener('click', async function() {
        if (!confirm('Supprimer définitivement cet article ?')) return;
        try {
          await supprimerProduit(bouton.dataset.supprimer);
        } catch (erreur) {
          console.error(erreur);
          alert("Impossible de supprimer l'article.");
        }
      });
    });
  }

  const formulaireArticle = document.getElementById('article-form');
  const messageArticle = document.getElementById('article-message');

  document.getElementById('bouton-nouvel-article').addEventListener('click', function() {
    ouvrirFormulaireArticle(null);
  });

  document.getElementById('bouton-annuler-article').addEventListener('click', function() {
    formulaireArticle.classList.add('hidden');
  });

  function initialiserGestionChampsImages() {
    const premierBoutonPlus = document.querySelector('.bouton-ajouter-champ-image');
    if (premierBoutonPlus) {
      premierBoutonPlus.addEventListener('click', ajouterNouveauChampImage);
    }
  }

  function ajouterNouveauChampImage() {
    const conteneur = document.getElementById('images-lignes-conteneur');
    const ligne = document.createElement('div');
    ligne.className = 'ligne-input-fichier';
    ligne.style.display = 'flex';
    ligne.style.alignItems = 'center';
    ligne.style.gap = '8px';
    ligne.innerHTML = `
      <input type="file" class="article-fichiers-input" accept="image/*" multiple style="flex: 1 1 auto; width: 100%; min-width: 0;" />
      <button type="button" class="btn btn-secondary btn-icon bouton-supprimer-champ-image" title="Retirer ce champ" style="flex: none;">−</button>
    `;
    ligne.querySelector('.bouton-supprimer-champ-image').addEventListener('click', function() {
      ligne.remove();
    });
    conteneur.appendChild(ligne);
  }

  function reinitialiserChampsImages() {
    const conteneur = document.getElementById('images-lignes-conteneur');
    conteneur.innerHTML = `
      <div class="ligne-input-fichier" style="display: flex; align-items: center; gap: 8px;">
        <input type="file" class="article-fichiers-input" accept="image/*" multiple style="flex: 1 1 auto; width: 100%; min-width: 0;" />
        <button type="button" class="btn btn-secondary btn-icon bouton-ajouter-champ-image" title="Ajouter un autre champ" style="flex: none;">+</button>
      </div>
    `;
    initialiserGestionChampsImages();
  }

  function afficherLignesCouleursProduit() {
    const conteneur = document.getElementById('couleurs-produit-conteneur');
    conteneur.innerHTML = '';

    variantesCouleursActuelles.forEach(function(variante, index) {
      const bloc = document.createElement('div');
      bloc.className = 'couleur-produit-bloc';

      let apercuImgsHTML = '';
      if (variante.images && variante.images.length > 0) {
        apercuImgsHTML = variante.images.map((url, imgIdx) => `
          <div style="position:relative; display:inline-block;">
            <img src="${echapperHTML(url)}" style="width:45px; height:45px; object-fit:cover; border-radius:4px; border:1px solid var(--line);">
            <button type="button" data-supprimer-img-couleur="${index}-${imgIdx}" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border:none; border-radius:50%; width:16px; height:16px; cursor:pointer; font-size:10px;">×</button>
          </div>
        `).join('');
      } else {
        apercuImgsHTML = '<span style="font-size:0.85rem; color:#e53935; font-weight:500;">* Au moins 1 image obligatoire pour cette couleur</span>';
      }

      bloc.innerHTML = `
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="text" class="input-nom-couleur" placeholder="Nom couleur (ex: Rouge)*" value="${echapperHTML(variante.nom || '')}" style="flex: 2; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg-elevated); color: var(--ink);">
          <input type="number" class="input-prix-couleur" placeholder="Prix (€)*" min="0" step="0.01" value="${variante.prixBase !== undefined && variante.prixBase !== null ? variante.prixBase : ''}" style="flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg-elevated); color: var(--ink);">
          <button type="button" class="btn btn-secondary btn-icon bouton-supprimer-couleur" data-index="${index}" style="background: #e53935; color: white; border: none;">Supprimer</button>
        </div>
        <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
          <input type="file" class="input-fichiers-couleur" accept="image/*" multiple style="font-size: 0.85rem; flex: 1;">
        </div>
        <div class="apercu-images-couleur" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px;">
          ${apercuImgsHTML}
        </div>
      `;

      bloc.querySelector('.input-nom-couleur').addEventListener('input', function() {
        variantesCouleursActuelles[index].nom = this.value;
      });

      bloc.querySelector('.input-prix-couleur').addEventListener('input', function() {
        variantesCouleursActuelles[index].prixBase = this.value === '' ? null : parseFloat(this.value);
      });

      bloc.querySelector('.input-fichiers-couleur').addEventListener('change', async function() {
        if (this.files && this.files.length > 0) {
          for (const f of this.files) {
            if (f.size > TAILLE_MAX_FICHIER) {
              alert(`Le fichier "${f.name}" dépasse la limite autorisée de 1 Mo.`);
              this.value = '';
              return;
            }
          }
          try {
            const fichiersTab = Array.from(this.files);
            const bases64 = await Promise.all(fichiersTab.map(f => convertirFichierEnBase64(f)));
            if (!variantesCouleursActuelles[index].images) {
              variantesCouleursActuelles[index].images = [];
            }
            variantesCouleursActuelles[index].images = variantesCouleursActuelles[index].images.concat(bases64);
            afficherLignesCouleursProduit();
          } catch (err) {
            console.error("Erreur conversion images couleur :", err);
          }
        }
      });

      bloc.querySelectorAll('[data-supprimer-img-couleur]').forEach(btnSup => {
        btnSup.addEventListener('click', function() {
          const [cIdx, iIdx] = this.dataset.supprimerImgCouleur.split('-').map(Number);
          variantesCouleursActuelles[cIdx].images.splice(iIdx, 1);
          afficherLignesCouleursProduit();
        });
      });

      bloc.querySelector('.bouton-supprimer-couleur').addEventListener('click', function() {
        variantesCouleursActuelles.splice(index, 1);
        afficherLignesCouleursProduit();
      });

      conteneur.appendChild(bloc);
    });
  }

  document.getElementById('bouton-ajouter-variante-couleur').addEventListener('click', function() {
    variantesCouleursActuelles.push({ nom: '', prixBase: null, images: [] });
    afficherLignesCouleursProduit();
  });

  function afficherLignesCollections() {
    const conteneur = document.getElementById('collections-lignes-conteneur');
    conteneur.innerHTML = '';

    collectionsSelectionnees.forEach(function(valeurActive, index) {
      const ligne = document.createElement('div');
      ligne.className = 'collection-ligne-item';
      const collectionObj = collectionsActuelles.find(function(c) { return c.id === valeurActive; });
      const labelTxt = collectionObj ? collectionObj.label : 'Aucun (visible seulement dans "Tout voir")';

      let optionsHTML = `<li data-value="" class="${!valeurActive ? 'selected' : ''}">Aucun (visible seulement dans "Tout voir")</li>`;
      optionsHTML += collectionsActuelles.map(function(c) {
        const isSelected = valeurActive === c.id ? 'selected' : '';
        return `<li data-value="${echapperHTML(c.id)}" class="${isSelected}">${echapperHTML(c.label)}</li>`;
      }).join('');

      ligne.innerHTML = `
        <input type="hidden" class="collection-valeur-hidden" value="${echapperHTML(valeurActive)}">
        <div class="custom-select">
          <button type="button" class="custom-select-toggle" aria-expanded="false">
            <span>${echapperHTML(labelTxt)}</span>
            <svg class="caret" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="custom-select-options" role="listbox">${optionsHTML}</ul>
        </div>
        ${index === 0
          ? `<button type="button" class="btn btn-secondary btn-icon bouton-ajouter-collection" title="Ajouter un autre onglet">+</button>`
          : `<button type="button" class="btn btn-secondary btn-icon bouton-supprimer-collection" data-index="${index}" title="Retirer cet onglet">−</button>`
        }
      `;

      const toggleBtn = ligne.querySelector('.custom-select-toggle');
      const optionsUl = ligne.querySelector('.custom-select-options');
      const labelSpan = toggleBtn.querySelector('span');
      const hiddenInp = ligne.querySelector('.collection-valeur-hidden');

      toggleBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        optionsUl.classList.toggle('open');
      });

      optionsUl.querySelectorAll('li').forEach(function(li) {
        li.addEventListener('click', function() {
          const val = this.dataset.value;
          hiddenInp.value = val;
          labelSpan.textContent = this.textContent;
          collectionsSelectionnees[index] = val;
          optionsUl.classList.remove('open');
        });
      });

      conteneur.appendChild(ligne);
    });

    const btnAjouter = conteneur.querySelector('.bouton-ajouter-collection');
    if (btnAjouter) {
      btnAjouter.addEventListener('click', function() {
        collectionsSelectionnees.push('');
        afficherLignesCollections();
      });
    }

    conteneur.querySelectorAll('.bouton-supprimer-collection').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const idx = parseInt(this.dataset.index, 10);
        collectionsSelectionnees.splice(idx, 1);
        afficherLignesCollections();
      });
    });
  }

  function ouvrirFormulaireArticle(id) {
    messageArticle.style.display = 'none';
    const produit = id ? produitsActuels.find(function(p) { return p.id === id; }) : null;

    document.getElementById('article-id-en-cours').value = id || '';
    document.getElementById('article-nom').value = produit ? produit.nom : '';
    document.getElementById('article-description').value = produit ? (produit.description || '') : '';
    document.getElementById('article-prix-base').value = produit ? produit.prixBase : '';
    document.getElementById('article-taxes').value = produit ? produit.taxes : 0.40;

    reinitialiserChampsImages();
    imagesActuellesEnCours = produit && produit.images ? [...produit.images] : [];
    afficherApercuImagesExistantes();

    variantesCouleursActuelles = produit && produit.variantesCouleurs ? JSON.parse(JSON.stringify(produit.variantesCouleurs)) : [];
    afficherLignesCouleursProduit();

    if (produit && produit.collections && Array.isArray(produit.collections) && produit.collections.length > 0) {
      collectionsSelectionnees = produit.collections.slice();
    } else {
      collectionsSelectionnees = [''];
    }
    afficherLignesCollections();

    formulaireArticle.classList.remove('hidden');
    formulaireArticle.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function afficherApercuImagesExistantes() {
    const conteneur = document.getElementById('apercu-images-existantes');
    if (!conteneur) return;
    conteneur.innerHTML = imagesActuellesEnCours.map((url, index) => `
      <div style="position:relative; display:inline-block;">
        <img src="${echapperHTML(url)}" style="width:60px; height:60px; object-fit:cover; border-radius:4px; border:1px solid var(--line);">
        <button type="button" data-supprimer-img="${index}" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border:none; border-radius:50%; width:18px; height:18px; cursor:pointer;">×</button>
      </div>
    `).join('');

    conteneur.querySelectorAll('[data-supprimer-img]').forEach(btn => {
      btn.addEventListener('click', function() {
        imagesActuellesEnCours.splice(parseInt(this.dataset.supprimerImg, 10), 1);
        afficherApercuImagesExistantes();
      });
    });
  }

  formulaireArticle.addEventListener('submit', async function(event) {
    event.preventDefault();
    messageArticle.style.display = 'none';

    const id = document.getElementById('article-id-en-cours').value;
    const inputsFichiers = document.querySelectorAll('.article-fichiers-input');
    let nouveauxFichiers = [];

    for (const input of inputsFichiers) {
      if (input.files && input.files.length > 0) {
        for (const f of input.files) {
          if (f.size > TAILLE_MAX_FICHIER) {
            messageArticle.textContent = `Le fichier "${f.name}" dépasse 1 Mo. Impossible de l'importer.`;
            messageArticle.style.display = 'block';
            return;
          }
          nouveauxFichiers.push(f);
        }
      }
    }

    // VERIFICATION STRICTE DES VARIANTES DE COULEURS SI ELLES SONT PRESENTES
    for (let i = 0; i < variantesCouleursActuelles.length; i++) {
      const v = variantesCouleursActuelles[i];
      if (!v.nom || v.nom.trim() === '') {
        messageArticle.textContent = `La variante de couleur #${i + 1} doit obligatoirement avoir un nom.`;
        messageArticle.style.display = 'block';
        return;
      }
      if (v.prixBase === undefined || v.prixBase === null || isNaN(v.prixBase)) {
        messageArticle.textContent = `La couleur "${v.nom}" doit obligatoirement avoir un prix défini.`;
        messageArticle.style.display = 'block';
        return;
      }
      if (!v.images || v.images.length === 0) {
        messageArticle.textContent = `La couleur "${v.nom}" doit obligatoirement avoir au moins une image.`;
        messageArticle.style.display = 'block';
        return;
      }
    }

    const collectionsFiltrees = collectionsSelectionnees.map(c => c.trim()).filter(Boolean);
    const boutonSubmit = formulaireArticle.querySelector('button[type="submit"]');

    try {
      boutonSubmit.disabled = true;
      boutonSubmit.textContent = 'Enregistrement...';

      let nouvellesUrlsBase64 = [];
      if (nouveauxFichiers.length > 0) {
        nouvellesUrlsBase64 = await Promise.all(nouveauxFichiers.map(f => convertirFichierEnBase64(f)));
      }

      const toutesLesImages = [...imagesActuellesEnCours, ...nouvellesUrlsBase64].filter(Boolean);

      // L'IMAGE PRINCIPALE EST OBLIGATOIRE
      if (toutesLesImages.length === 0) {
        messageArticle.textContent = "L'article doit comporter au moins une image principale.";
        messageArticle.style.display = 'block';
        boutonSubmit.disabled = false;
        boutonSubmit.textContent = 'Enregistrer';
        return;
      }

      const variantesNettoyees = variantesCouleursActuelles.map(v => ({
        nom: String(v.nom).trim(),
        prixBase: Number(v.prixBase),
        images: Array.isArray(v.images) ? v.images.filter(Boolean) : []
      }));

      const donnees = {
        nom: document.getElementById('article-nom').value.trim(),
        description: document.getElementById('article-description').value.trim(),
        prixBase: parseFloat(document.getElementById('article-prix-base').value) || 0,
        taxes: parseFloat(document.getElementById('article-taxes').value) || 0,
        images: toutesLesImages,
        variantesCouleurs: variantesNettoyees,
        collections: Array.from(new Set(collectionsFiltrees))
      };

      const tailleTotaleOctets = new TextEncoder().encode(JSON.stringify(donnees)).length;
      if (tailleTotaleOctets > TAILLE_MAX_TOTALE) {
        messageArticle.textContent = `La taille totale (${(tailleTotaleOctets / 1024 / 1024).toFixed(2)} Mo) dépasse la limite Firestore (1 Mo). Réduisez la taille des images.`;
        messageArticle.style.display = 'block';
        boutonSubmit.disabled = false;
        boutonSubmit.textContent = 'Enregistrer';
        return;
      }

      if (id) {
        await modifierProduit(id, donnees);
      } else {
        await ajouterProduit(donnees);
      }
      formulaireArticle.classList.add('hidden');
    } catch (erreur) {
      console.error(erreur);
      messageArticle.textContent = "Erreur : " + erreur.message;
      messageArticle.style.display = 'block';
    } finally {
      boutonSubmit.disabled = false;
      boutonSubmit.textContent = 'Enregistrer';
    }
  });

  async function chargerCollections() {
    collectionsActuelles = await obtenirCollections();
    afficherLignesCollections();
  }
</script>
