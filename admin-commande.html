<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration Commandes & Couleurs — Gabshop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-couleurs-liste {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }
    .couleur-form-grille {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .couleur-form-grille {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div id="site-header"></div>
</header>

<main>

  <p id="admin-chargement" class="account-intro">Vérification des droits...</p>

  <div id="admin-contenu" class="hidden">

    <p class="account-eyebrow">GABSHOP</p>
    <h1>Administration — Commandes & Couleurs</h1>

    <!-- ================================================= -->
    <!-- GESTION DES COULEURS DISPONIBLES -->
    <!-- ================================================= -->

    <section class="admin-section">
      <h2>Couleurs disponibles pour l'impression</h2>
      <p class="account-intro">
        Ces couleurs apparaissent dans le formulaire de commande avec leur tarif respectif au gramme.
      </p>

      <div id="admin-couleurs-liste" class="admin-couleurs-liste"></div>

      <form id="couleur-form" class="account-form admin-form">
        <h3>Ajouter une couleur</h3>
        
        <div class="couleur-form-grille">
          <div>
            <label for="couleur-nom">Nom de la couleur</label>
            <input type="text" id="couleur-nom" placeholder="Ex : Bleue, Rouge, Arc-en-ciel..." required>
          </div>

          <div>
            <label for="couleur-prix">Prix (centimes par gramme)</label>
            <input type="number" id="couleur-prix" min="1" step="1" placeholder="Ex : 12" required>
          </div>
        </div>

        <p id="couleur-message" class="form-error" style="display:none;"></p>

        <button type="submit" class="btn btn-primary">+ Ajouter la couleur</button>
      </form>
    </section>

    <div style="margin-top: 24px;">
      <a href="admin.html" class="btn btn-secondary">← Retour à l'administration</a>
    </div>

  </div>

</main>

<script type="module" src="main.js"></script>
<script type="module">
  import { auth } from './firebase-config.js';
  import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';
  import {
    protegerPage,
    obtenirCouleurs,
    ajouterCouleur,
    modifierCouleur,
    supprimerCouleur
  } from './main.js';

  // 1. Protection de la page via la fonction dédiée
  protegerPage(['admin']);

  const blocChargement = document.getElementById('admin-chargement');
  const blocContenu = document.getElementById('admin-contenu');

  function echapperHTML(texte) {
    const element = document.createElement('div');
    element.textContent = texte || '';
    return element.innerHTML;
  }

  let couleursActuelles = [];

  // 2. Fonctions de gestion des couleurs
  async function chargerCouleurs() {
    try {
      couleursActuelles = await obtenirCouleurs();
      afficherCouleurs();
    } catch (erreur) {
      console.error('Erreur lors du chargement des couleurs :', erreur);
    }
  }

  function afficherCouleurs() {
    const conteneur = document.getElementById('admin-couleurs-liste');

    if (couleursActuelles.length === 0) {
      conteneur.innerHTML = '<p class="account-intro">Aucune couleur enregistrée.</p>';
      return;
    }

    conteneur.innerHTML = couleursActuelles.map(function(c) {
      return `
        <div class="admin-ligne">
          <div class="admin-ligne-info">
            <strong>${echapperHTML(c.nom)}</strong>
            <span>${echapperHTML(String(c.prixCentimes))} centimes / g</span>
          </div>
          <div class="admin-ligne-actions">
            <button type="button" class="btn btn-secondary" data-modifier-couleur="${echapperHTML(c.id)}">Modifier</button>
            <button type="button" class="btn btn-secondary" data-supprimer-couleur="${echapperHTML(c.id)}">Supprimer</button>
          </div>
        </div>
      `;
    }).join('');

    // Événement Modifier
    conteneur.querySelectorAll('[data-modifier-couleur]').forEach(function(bouton) {
      bouton.addEventListener('click', async function() {
        const couleur = couleursActuelles.find(function(c) { return c.id === bouton.dataset.modifierCouleur; });
        if (!couleur) return;

        const nouveauNom = prompt('Nouveau nom de la couleur :', couleur.nom);
        if (nouveauNom === null || !nouveauNom.trim()) return;

        const nouveauPrixStr = prompt('Nouveau prix en centimes par gramme :', couleur.prixCentimes);
        const nouveauPrix = parseInt(nouveauPrixStr, 10);
        if (isNaN(nouveauPrix) || nouveauPrix <= 0) {
          alert('Prix invalide.');
          return;
        }

        try {
          await modifierCouleur(couleur.id, {
            nom: nouveauNom.trim(),
            prixCentimes: nouveauPrix
          });
          await chargerCouleurs();
        } catch (erreur) {
          console.error(erreur);
          alert('Impossible de modifier la couleur.');
        }
      });
    });

    // Événement Supprimer
    conteneur.querySelectorAll('[data-supprimer-couleur]').forEach(function(bouton) {
      bouton.addEventListener('click', async function() {
        if (!confirm('Supprimer cette couleur ?')) return;

        try {
          await supprimerCouleur(bouton.dataset.supprimerCouleur);
          await chargerCouleurs();
        } catch (erreur) {
          console.error(erreur);
          alert('Impossible de supprimer la couleur.');
        }
      });
    });
  }

  // Soumission du formulaire d'ajout
  document.getElementById('couleur-form').addEventListener('submit', async function(event) {
    event.preventDefault();

    const champNom = document.getElementById('couleur-nom');
    const champPrix = document.getElementById('couleur-prix');
    const messageErreur = document.getElementById('couleur-message');

    const nom = champNom.value.trim();
    const prixCentimes = parseInt(champPrix.value, 10);

    if (!nom || isNaN(prixCentimes) || prixCentimes <= 0) {
      messageErreur.textContent = 'Merci de saisir un nom et un prix valide.';
      messageErreur.style.display = 'block';
      return;
    }

    try {
      await ajouterCouleur({ nom, prixCentimes });
      champNom.value = '';
      champPrix.value = '';
      messageErreur.style.display = 'none';

      await chargerCouleurs();
    } catch (erreur) {
      console.error(erreur);
      messageErreur.textContent = "Impossible d'ajouter cette couleur.";
      messageErreur.style.display = 'block';
    }
  });

  // 3. Initialisation au suivi de connexion
  onAuthStateChanged(auth, function(utilisateur) {
    if (utilisateur) {
      blocChargement.classList.add('hidden');
      blocContenu.classList.remove('hidden');
      chargerCouleurs();
    }
  });
</script>

</body>
</html>
